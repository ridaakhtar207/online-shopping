<!DOCTYPE html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Wishlist — Bazaar.pk</title>
  <meta name="description" content="Your saved products on Bazaar.pk. Add them to your cart whenever you're ready.">
  <meta name="theme-color" content="#054735">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307835c'/%3E%3Cpath d='M20 24h24l2 24H18l2-24Z' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M26 24v-3a6 6 0 0 1 12 0v3' fill='none' stroke='%23c3ea7a' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="wishlist">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep" aria-hidden="true">/</span>
        <span aria-current="page">Wishlist</span>
      </nav>

      <div class="page-head">
        <div>
          <h1>My wishlist</h1>
          <p id="wishlistSubtitle">Saved for later — but not for long, hopefully.</p>
        </div>
        <span class="head-note">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          Saved on this device
        </span>
      </div>

      <div class="wishlist-layout">
        <div class="wishlist-toolbar" id="wishlistToolbar">
          <p id="wishlistCountText">0 products saved</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-outline btn-sm" type="button" id="clearWishlist">Clear wishlist</button>
            <button class="btn btn-primary btn-sm" type="button" id="addAll">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
              Add all to cart
            </button>
          </div>
        </div>

        <div class="product-grid" id="wishlistGrid" aria-live="polite"></div>

        <div class="empty-state" id="wishlistEmpty" hidden>
          <div class="empty-emoji">💚</div>
          <h2>Nothing saved yet</h2>
          <p>Tap the heart on any product to keep it here while you decide.</p>
          <a class="btn btn-primary" href="shop.html">Discover products</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/wishlist.js" defer></script>
</body>
</html>
